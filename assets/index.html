<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flutter WebView Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        .webview-button {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .webview-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }
        .webview-button:active {
            transform: translateY(0);
        }
        .message {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            border-left: 4px solid #28a745;
            display: none;
        }
        .counter {
            font-size: 24px;
            font-weight: bold;
            color: #007bff;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Flutter WebView Test</h1>
        <div class="counter" id="counter">Clicks: 0</div>
        <button class="webview-button" onclick="handleButtonClick()">
            Click Me!
        </button>
        <button class="webview-button" onclick="sendMessageToFlutter()">
            Send Message to Flutter
        </button>
        <div class="message" id="message">
            Message sent to Flutter successfully!
        </div>
    </div>

    <script>
        let clickCount = 0;

        function handleButtonClick() {
            clickCount++;
            document.getElementById('counter').textContent = `Clicks: ${clickCount}`;
            
            // Send data to Flutter using JavaScript channel
            const message = {
                type: 'buttonClick',
                count: clickCount,
                message: 'Button clicked from WebView!'
            };
            
            console.log('Sending message to Flutter:', message);
            
            if (window.Flutter) {
                console.log('Flutter channel found, sending message...');
                window.Flutter.postMessage(JSON.stringify(message));
            } else {
                console.log('Flutter channel not found!');
            }
        }

        function sendMessageToFlutter() {
            const message = {
                type: 'message',
                content: 'Hello from WebView!',
                timestamp: new Date().toISOString()
            };
            
            console.log('Sending message to Flutter:', message);
            
            if (window.Flutter) {
                console.log('Flutter channel found, sending message...');
                window.Flutter.postMessage(JSON.stringify(message));
            } else {
                console.log('Flutter channel not found!');
            }
            
            // Show success message
            const messageDiv = document.getElementById('message');
            messageDiv.style.display = 'block';
            setTimeout(() => {
                messageDiv.style.display = 'none';
            }, 3000);
        }

        // Notify Flutter that WebView is ready
        window.addEventListener('load', function() {
            console.log('WebView loaded, checking for Flutter channel...');
            const readyMessage = {
                type: 'ready',
                status: 'WebView is ready!'
            };
            
            if (window.Flutter) {
                console.log('Flutter channel found, sending ready message...');
                window.Flutter.postMessage(JSON.stringify(readyMessage));
            } else {
                console.log('Flutter channel not found on load!');
            }
        });

        // Function to receive messages from Flutter
        window.receiveMessageFromFlutter = function(message) {
            console.log('Received message from Flutter:', message);
            
            // Display the message on the page
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = `Flutter says: ${message.content}`;
            messageDiv.style.display = 'block';
            messageDiv.style.borderLeftColor = '#007bff';
            
            setTimeout(() => {
                messageDiv.style.display = 'none';
            }, 3000);
        };

        // Function to reset counter (called from Flutter)
        window.resetCounter = function() {
            clickCount = 0;
            document.getElementById('counter').textContent = `Clicks: ${clickCount}`;
            console.log('Counter reset by Flutter');
        };
    </script>
</body>
</html>
